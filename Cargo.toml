[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/mitsuhiko/tvpipe"
homepage = "https://tvpipe.party/"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]

[profile.release]
debug = 1

# The real-time tests (built-in H.264/AAC encoders paced at 30 fps, fake
# receivers counting frames) drop frames when unoptimized on loaded or slow
# machines: CI runners, emulated x86_64, a busy laptop. Debug assertions and
# overflow checks stay on.
[profile.test]
opt-level = 1
