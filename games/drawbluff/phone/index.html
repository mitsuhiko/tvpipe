<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d5c">
<title>Drawbluff</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="phone.js"></script>
</head>
<body>
<header>
  <span class="logo">Drawbluff</span>
  <span id="who"></span>
  <button id="sound" type="button" aria-label="Sound"></button>
  <span id="timer" hidden></span>
</header>
<div id="banner" hidden></div>
<main id="app">
  <section class="card"><p class="big">…</p></section>
</main>
<template id="t-join">
  <section class="card">
    <h1>Join the game</h1>
    <form id="join-form" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" autocapitalize="words" enterkeyhint="go" required>
      <button type="submit" class="primary">Join</button>
      <p class="error" id="join-error"></p>
    </form>
  </section>
</template>
</body>
</html>
