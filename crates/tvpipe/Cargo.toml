[package]
name = "tvpipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Stream a program's frames and sound, files, web pages or the screen to Apple TVs, Chromecasts and browser tabs with low latency, in process"
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/tvpipe"
keywords = ["airplay", "chromecast", "mirroring", "streaming", "gamedev"]
categories = ["multimedia::video", "network-programming", "game-development"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/LICENSES/",
    "/src/",
    "/examples/",
    "/tests/",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["airplay", "cast", "player", "h264"]
# AirPlay mirroring: mDNS AirPlay records, pairing, mirroring, ALAC audio.
airplay = []
# FairPlay SAP for AirPlay (the LGPL-3.0-or-later tvpipe-fairplay crate).
# Without it, AirPlay runs the HAP profile without FairPlay; receivers that
# need it fail with `fairplay-required`.
fairplay = ["airplay", "dep:tvpipe-fairplay"]
# Google Cast: control over TLS, Cast Streaming, the AAC encoder.
cast = ["dep:rustls", "aac"]
# The built-in AAC-LC encoder.
aac = []
# The `browser` receiver: a player page on 127.0.0.1.
player = []
# `share`: the capture page.
share = ["player"]
# `share URL` and `screen`: a browser of tvpipe's own over DevTools/BiDi.
headless = ["share"]
# Public links for the pages (Cloudflare quick tunnels, OpenTunnel).
tunnel = ["dep:rustls", "player"]
# `playshare`: web games served by tvpipe (a bundle, the relay for
# phones, the TV page cast through `share URL`).
playshare = ["headless", "tunnel"]
# Passthrough of MP4/MOV/Matroska files without ffmpeg.
files = []
# Files, URLs and capture through an ffmpeg subprocess.
ffmpeg = ["files"]
# The built-in H.264 encoder (raw frames, the test pattern).
h264 = []
# `tvpipe::signals`: Ctrl-C/SIGTERM as a stop request (a handler of its own
# over the C runtime; never installed unless asked for).
signals = []

[dependencies]
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tvpipe-fairplay = { path = "../tvpipe-fairplay", version = "0.4.1", optional = true }
