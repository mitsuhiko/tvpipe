<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tvpipe share</title>
<link rel="preload" href="/fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/michroma.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/sixtyfour.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('tvpipe-theme') || 'auto'; } catch (e) {}</script>
<link rel="stylesheet" href="/ui.css">
<style>
  /* tvpipe's look (/ui.css: src/browser/ui.css, as on the website and
     playshare's launcher); what only this page has: */
  .state.streaming::before { animation: tvpipe-pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .state.streaming::before { animation: none; } }
  #message { font-size: 17px; font-weight: 300; line-height: 1.55; margin: 0 0 26px; min-height: 1.55em; }
  #message.bad { color: var(--bad); }
  .buttons { margin-bottom: 18px; }
  label.check { display: inline-flex; gap: 9px; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; }
  label.check input { accent-color: var(--accent); margin: 0; }
  .note { margin-top: 26px; }
  .note b { color: var(--ink); font-weight: 600; }
  .note ol { margin: 8px 0; padding-left: 20px; }
  .note code { font: 400 13px "IBM Plex Mono", monospace; color: var(--ink); white-space: nowrap; }

  .sec { padding: 22px 0 0; }
  details .hint { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; margin: 22px 0 0; font-size: 14px; }
  dt, dd { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  dt { color: var(--ink-3); padding-right: 32px; }
  dd { margin: 0; font: 400 13px/1.6 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; padding-top: 10px; }
  #log { margin: 22px 0 0; padding: 14px 16px; background: var(--panel); border-radius: 4px; color: var(--ink-2);
         font: 400 12.5px/1.65 "IBM Plex Mono", monospace; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  #log:empty { display: none; }
  #log .error { color: var(--bad); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 560 520">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g style="stroke:var(--logo-ink)" stroke-width="12"><line x1="208" y1="118" x2="152" y2="62"/><line x1="256" y1="118" x2="322" y2="40"/></g>
      <g style="fill:var(--logo-ink)"><circle cx="152" cy="62" r="14"/><circle cx="322" cy="40" r="14"/><path d="M180 137 A52 30 0 0 1 284 137 Z"/><path d="M92 474 A19 19 0 0 0 130 474 Z"/><path d="M334 474 A19 19 0 0 0 372 474 Z"/></g>
      <rect x="23" y="137" width="419" height="331" rx="48" style="stroke:var(--logo-ink);fill:var(--logo-screen)" stroke-width="16"/>
      <path d="M92 180 Q211 168 330 180 Q350 182 352 202 Q360 301 352 400 Q350 420 330 422 Q211 434 92 422 Q72 420 70 400 Q62 301 70 202 Q72 182 92 180 Z" style="stroke:var(--logo-ink)" stroke-width="14"/>
      <circle cx="390" cy="222" r="17" fill="#E8743B"/><circle cx="390" cy="272" r="12" fill="#E8743B"/>
      <g stroke-width="14">
        <path d="M190 268 C265 268 325 300 393 360 L390 322 A55 13 0 0 0 500 322 C506 370 500 420 455 437 C420 446 390 440 360 412 C300 350 250 304 190 304 Z" style="stroke:var(--logo-screen)" stroke-width="40"/>
        <path d="M190 268 C265 268 325 300 393 360 L390 322 A55 13 0 0 0 500 322 C506 370 500 420 455 437 C420 446 390 440 360 412 C300 350 250 304 190 304 Z" fill="#E8743B" style="stroke:var(--logo-ink)"/>
        <ellipse cx="445" cy="322" rx="55" ry="13" style="fill:var(--logo-screen);stroke:var(--logo-ink)"/>
        <line x1="182" y1="262" x2="182" y2="310" style="stroke:var(--logo-ink)" stroke-width="16"/>
      </g>
      <g stroke="#E8743B" stroke-width="13" transform="translate(12 0)"><path d="M492 225 C492 205 464 195 464 160 C464 136 482 120 502 120 C522 120 536 135 533 155 C531 170 518 177 507 175"/><path d="M470 290 C468 262 492 252 506 242 C520 230 524 214 518 200"/></g>
    </g>
  </symbol>
</svg>

<header class="top">
  <div class="mark"><svg viewBox="0 0 560 520" aria-hidden="true"><use href="#logo"/></svg><span>tv<b>pipe</b></span></div>
  <div class="pair">tvpipe<span>Share</span></div>
  <div class="pair">Receivers<span id="receivers">–</span></div>
</header>

<main>
  <section class="row ph">
    <div class="meta"><span class="lbl">Status</span><span class="state" id="state">Connecting to tvpipe…</span></div>
    <div class="body">
      <h1>Share a tab, window or screen</h1>
      <p id="message"></p>
      <div class="buttons">
        <button id="share" class="btn primary" disabled>Share…</button>
        <button id="stop" class="btn" disabled>Stop</button>
      </div>
      <label id="localLabel" class="check"><input type="checkbox" id="local"> Keep tab audio playing here</label>
      <div id="howto" class="note" hidden></div>
    </div>
  </section>

  <section class="row sec">
    <div class="meta"></div>
    <details class="body" id="details">
      <summary><span class="lbl">Details</span></summary>
      <p class="hint">The capture, the encoder and the log, for finding problems.</p>
      <dl>
        <dt>Capture</dt><dd id="capture">–</dd>
        <dt>Stream</dt><dd id="plan">–</dd>
        <dt>Encoder</dt><dd id="codec">–</dd>
        <dt>Frame rate</dt><dd id="fps">–</dd>
        <dt>Bitrate</dt><dd id="kbps">–</dd>
        <dt>Encode delay</dt><dd id="delay">–</dd>
        <dt>Dropped</dt><dd id="dropped">–</dd>
      </dl>
      <pre id="log"></pre>
    </details>
  </section>
</main>

<footer class="foot">
  <span>tvpipe share · 127.0.0.1</span>
  <div class="theme" role="group" aria-label="Colour theme">
    <button data-t="light" title="Light" aria-label="Light"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.25v1.5M8 13.25v1.5M1.25 8h1.5M13.25 8h1.5M3.2 3.2l1.06 1.06M11.74 11.74l1.06 1.06M3.2 12.8l1.06-1.06M11.74 4.26l1.06-1.06"/></svg></button>
    <button data-t="dark" title="Dark" aria-label="Dark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 10.2A6 6 0 0 1 5.8 2.4a6 6 0 1 0 7.8 7.8z"/></svg></button>
    <button data-t="auto" title="Like the system" aria-label="Like the system"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path class="fill" d="M8 2.25a5.75 5.75 0 0 1 0 11.5z"/></svg></button>
  </div>
</footer>
<script src="/capture.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // The colour theme, as on the website: light, dark or the system's.
  var themes = document.querySelectorAll('.theme button');
  function theme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('tvpipe-theme', t); } catch (e) {}
    themes.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === t)); });
  }
  theme(document.documentElement.dataset.theme || 'auto');
  themes.forEach(function (b) { b.onclick = function () { theme(b.dataset.t); }; });

  // The details stay open or closed across reloads.
  var details = $('details');
  try { details.open = localStorage.getItem('tvpipe-share-details') === '1'; } catch (e) {}
  details.addEventListener('toggle', function () {
    try { localStorage.setItem('tvpipe-share-details', details.open ? '1' : '0'); } catch (e) {}
  });

  var logEl = $('log');
  function log(text, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = new Date().toLocaleTimeString() + '  ' + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    if (cls === 'error') { $('message').textContent = text; $('message').className = 'bad'; }
  }
  function state(text, cls, message) {
    $('state').textContent = text;
    $('state').className = 'state ' + (cls || '');
    if (message !== undefined) { $('message').textContent = message; $('message').className = cls === 'bad' ? 'bad' : ''; }
  }
  if (!window.tvpipeCapture) { state('capture.js did not load', 'bad'); return; }
  var f = tvpipeCapture.features();
  var missing = [];
  if (!f.secure) missing.push('a secure context (open the http://127.0.0.1 URL tvpipe printed)');
  if (!f.displayMedia) missing.push('screen capture (getDisplayMedia)');
  if (!f.webcodecs) missing.push('WebCodecs (VideoEncoder)');
  if (missing.length) log('This browser lacks ' + missing.join(', ') + '.', 'error');

  // Safari and Firefox share windows and screens, not tabs, and no sound.
  var howto = $('howto');
  if (!f.tabs) {
    var name = f.family === 'safari' ? 'Safari' : f.family === 'firefox' ? 'Firefox' : 'This browser';
    var sameApp = f.family === 'safari' || f.family === 'firefox';
    var stop = f.family === 'firefox' ? 'with <b>Stop Sharing</b> in Firefox\u2019s sharing indicator' : 'from the menu bar';
    var sound = f.family === 'firefox'
      ? 'For a web page with its sound, let tvpipe show it in a Firefox of its own: ' +
        '<code>tvpipe share URL --browser firefox</code>. For a tab of yours with sound, use Chrome or Edge.'
      : 'For a tab with sound, use Chrome or Edge.';
    howto.innerHTML = '<b>' + name + ' can share a window or the whole screen, but not a single tab, and no sound.</b>' +
      (sameApp ? '<ol><li>Press <b>Share…</b> and choose this ' + name + ' window (or the screen).</li>' +
        '<li>Switch the window to the tab you want on the TV. This page keeps streaming in the background.</li>' +
        '<li>Come back to this tab and press <b>Stop</b>, or stop sharing ' + stop + '.</li></ol>' +
        'Tip: drag the tab into its own window and share that window, so this page stays out of the picture. ' +
        sound : '');
    howto.hidden = false;
  }
  if (!f.audio) $('localLabel').hidden = true;

  var ws = location.origin.replace(/^http/, 'ws') + '/ws' + location.search;
  var cap = tvpipeCapture.connect(ws, {});
  // For automation and debugging (the console, tests driving Chrome).
  window.tvpipeShare = cap;
  var ended = false;
  function receivers(list) {
    $('receivers').textContent = list && list.length ? list.join(', ') : '–';
  }
  cap.on('open', function () { state('Connected', '', 'Waiting for tvpipe…'); });
  cap.on('config', function (c) {
    receivers(c.receivers);
    if (missing.length) { state('Unsupported', 'bad', 'This browser lacks ' + missing.join(', ') + '.'); return; }
    if (!ended) $('share').disabled = false;
    state('Ready', 'ok', 'Press Share and pick what to show' +
      (c.audio && f.audio ? ' (keep "Also share tab audio" ticked for sound).' : '.'));
  });
  cap.on('status', function (s) {
    receivers(s.receivers);
    var cls = s.state === 'streaming' ? 'ok streaming' : s.state === 'error' ? 'bad' : '';
    var names = { waiting: 'Ready', connecting: 'Connecting to the TV…', streaming: 'Streaming', error: 'Error' };
    state(names[s.state] || s.state, cls, s.message || '');
  });
  cap.on('capture', function (c) {
    var s = c.settings;
    $('capture').textContent = (s.displaySurface || 'surface') + ' ' + s.width + '×' + s.height +
      (s.frameRate ? ' @ ' + Math.round(s.frameRate) : '') + (c.audio ? ', with audio' : ', no audio');
    $('share').disabled = true;
    $('stop').disabled = false;
  });
  function showPlan(p) {
    var c = p.content;
    $('plan').textContent = p.width + '×' + p.height + ' @ ' + p.fps + ', ' + Math.round(p.bitrate / 1000) + ' kbit/s' +
      (p.audio ? ', PCM ' + p.audio.sampleRate + ' Hz' : '') +
      (c && (c.width !== p.width || c.height !== p.height) ? ' (picture ' + c.width + '×' + c.height + ', black bars)' : '');
  }
  cap.on('plan', showPlan);
  cap.on('bitrate', function () { showPlan(cap.plan); });
  cap.on('stats', function (s) {
    // For automation (the browser tests read these).
    window.tvpipeLastStats = s;
    if (s.keyLatencyMs !== null && s.keyLatencyMs !== undefined) window.tvpipeKeyLatency = s.keyLatencyMs;
    $('codec').textContent = (s.codec || '–') + (s.mode ? ' (' + (s.mode === 'worker' ? 'in a worker' : 'on the page') + ')' : '');
    $('fps').textContent = s.fps + ' (source ' + s.sourceFps + ')';
    $('kbps').textContent = s.kbps + ' kbit/s video' + (s.audioKbps ? ', ' + s.audioKbps + ' audio' : '');
    $('delay').textContent = s.encodeMs === null ? '–' : s.encodeMs + ' ms';
    $('dropped').textContent = s.dropped + (s.repeated ? ' (' + s.repeated + ' repeats of a still picture)' : '');
  });
  cap.on('log', function (l) { log(l.message, l.level === 'error' ? 'error' : ''); });
  cap.on('error', function (e) { log(e, 'error'); state('Error', 'bad', e); });
  cap.on('end', function (reason) {
    ended = true;
    state('Ended', '', reason + '. Run tvpipe share again to share something else.');
    $('share').disabled = true;
    $('stop').disabled = true;
  });
  cap.on('close', function () {
    if (!ended) state('Disconnected', 'bad', 'tvpipe is not running any more.');
    ended = true;
    $('share').disabled = true;
    $('stop').disabled = true;
  });
  $('share').onclick = function () {
    cap.opts.localAudio = $('local').checked;
    $('share').disabled = true;
    cap.captureDisplay().catch(function (e) {
      var msg = e && e.name === 'NotAllowedError' ? 'Sharing was cancelled.' : String(e && e.message || e);
      log(msg, 'error');
      if (!ended) $('share').disabled = false;
    });
  };
  $('stop').onclick = function () { cap.stop('stopped on the share page'); };
})();
</script>
</body>
</html>
