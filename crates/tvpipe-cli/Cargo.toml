[package]
name = "tvpipe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Low-latency mirroring of video and audio to AirPlay and Google Cast receivers (the tvpipe command)"
# The source; the built binary includes tvpipe-fairplay (LGPL-3.0-or-later)
# and is distributed under its terms.
license = "Apache-2.0"
readme = "README.md"
keywords = ["airplay", "chromecast", "mirroring", "streaming", "cli"]
categories = ["multimedia::video", "command-line-utilities"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/LICENSES/", "/src/", "/tests/"]

[[bin]]
name = "tvpipe"
path = "src/main.rs"

[dependencies]
argument = "0.1"
tvpipe = { path = "../tvpipe", version = "0.4.1", features = [
    "airplay",
    "fairplay",
    "cast",
    "aac",
    "player",
    "share",
    "headless",
    "tunnel",
    "playshare",
    "files",
    "ffmpeg",
    "h264",
    "signals",
] }
